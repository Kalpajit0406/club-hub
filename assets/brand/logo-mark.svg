<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="chGrad1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F5BE7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chGrad2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#2F5BE7"/>
    </linearGradient>
    <filter id="chShadow" x="0" y="2" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1220"/>
  
  <!-- Subtle Internal Grid Glow -->
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Connected Community Nodes Geometry (C & H Monogram) -->
  <g filter="url(#chShadow)">
    <!-- Left C Arc Path connecting to Top and Bottom Nodes -->
    <path d="M 24 11 C 15 11 11 16 11 24 C 11 32 15 37 24 37" 
          stroke="url(#chGrad1)" stroke-width="4" stroke-linecap="round"/>

    <!-- Central H Bridge and Vertical Right Pillar -->
    <path d="M 19 24 L 33 24 M 33 13 L 33 35" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Campus Community Node (Cobalt) -->
    <circle cx="24" cy="11" r="3.5" fill="#2F5BE7" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Bottom Campus Opportunity Node (Teal) -->
    <circle cx="24" cy="37" r="3.5" fill="#0F766E" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Central Intersection Node (Warm Amber Accent) -->
    <circle cx="19" cy="24" r="2.75" fill="#F4B544" stroke="#0B1220" stroke-width="1.5"/>

    <!-- Right Community Hub Node (Electric Blue) -->
    <circle cx="33" cy="24" r="3" fill="#2F5BE7" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
</svg>

