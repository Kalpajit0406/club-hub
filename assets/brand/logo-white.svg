<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44" fill="none">
  <defs>
    <linearGradient id="chWGrad" x1="2" y1="2" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F75F2"/>
      <stop offset="100%" stop-color="#2F5BE7"/>
    </linearGradient>
  </defs>

  <!-- Node Mark Icon -->
  <g transform="translate(2, 2)">
    <rect width="40" height="40" rx="10" fill="#111A2E"/>
    <rect width="40" height="40" rx="10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <!-- C Arc -->
    <path d="M 21 10 C 13 10 9 14.5 9 20 C 9 25.5 13 30 21 30" stroke="url(#chWGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- H Bars -->
    <path d="M 16 20 L 29 20 M 29 11 L 29 29" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Nodes -->
    <circle cx="21" cy="10" r="2.8" fill="#4F75F2" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="21" cy="30" r="2.8" fill="#14B8A6" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="16" cy="20" r="2.2" fill="#F4B544" stroke="#0B1220" stroke-width="1.2"/>
    <circle cx="29" cy="20" r="2.5" fill="#4F75F2" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Wordmark "ClubHub" (Light for dark header) -->
  <text x="54" y="29" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
    Club<tspan fill="#60A5FA">Hub</tspan>
  </text>
</svg>

