<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ClubHub — Smart Campus OS</title>
  <meta name="description" content="Sign in to your ClubHub account to explore clubs, register for campus events, buy textbooks in marketplace, and apply for internships.">

  <!-- Anti-Flicker Theme & Palette Init -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem("clubhub_theme_mode_v2") || "light";
      var savedPalette = localStorage.getItem("clubhub_active_palette") || "default";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.documentElement.setAttribute("data-palette", savedPalette);
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .demo-roles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .demo-role-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .demo-role-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .demo-role-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }
    .demo-role-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }
    .demo-role-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    
    <!-- BRAND & HEADER -->
    <div class="auth-header">
      <a href="index.html" class="auth-brand" aria-label="Return to ClubHub Home">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <div>Club<span>Hub</span></div>
      </a>
      <h1 class="auth-title">Welcome to ClubHub</h1>
      <p class="auth-subtitle">The all-in-one smart campus platform for university clubs, events, student marketplace, and internships.</p>
    </div>

    <!-- AUTH CARD -->
    <div class="auth-card">
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- 1-CLICK INSTANT DEMO LOGINS -->
      <div style="margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
        <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); display: block; margin-bottom: 4px;">
          ⚡ 1-Click Instant Demo Login:
        </label>
        <div class="demo-roles-grid">
          <button type="button" class="demo-role-btn" data-demo-role="student">
            <span class="demo-role-icon">🎓</span>
            <span class="demo-role-title">Student</span>
            <span class="demo-role-sub">Aditya Verma</span>
          </button>
          <button type="button" class="demo-role-btn" data-demo-role="admin">
            <span class="demo-role-icon">⚡</span>
            <span class="demo-role-title">Club Lead</span>
            <span class="demo-role-sub">GDSC Tech</span>
          </button>
          <button type="button" class="demo-role-btn" data-demo-role="recruiter">
            <span class="demo-role-icon">💼</span>
            <span class="demo-role-title">Recruiter</span>
            <span class="demo-role-sub">Microsoft Talent</span>
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input" 
            placeholder="e.g. aditya@tint.edu.in" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Account Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" data-target="login-password" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember session</span>
          </label>
          <a href="#" class="auth-link" onclick="if(typeof showToast==='function') showToast('Password reset dispatched to your email.', 'info')">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" style="width: 100%;">
          Sign In to ClubHub
        </button>
      </form>
    </div>

    <!-- FOOTER LINK -->
    <div class="auth-footer">
      New to campus? <a href="register.html" class="auth-link">Create your ClubHub Account</a> &bull; <a href="index.html" class="auth-link">Back to Home</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
