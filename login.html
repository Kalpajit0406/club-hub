<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ClubHub — Smart Campus OS</title>
  <meta name="description" content="Sign in to your ClubHub account to explore clubs, register for campus events, collaborate with peers, and view verified digital badges.">

  <!-- Anti-Flicker Theme & Palette Init -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem("clubhub_theme_mode_v2") || "light";
      var savedPalette = localStorage.getItem("clubhub_active_palette") || "indigo-steel";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.documentElement.setAttribute("data-palette", savedPalette);
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    
    <!-- BRAND & HEADER -->
    <div class="auth-header">
      <a href="index.html" class="nav-brand auth-brand" aria-label="Return to ClubHub Home">
        <span class="brand-name">Club<span>Hub</span></span>
      </a>
      <h1 class="auth-title">Welcome to ClubHub</h1>
      <p class="auth-subtitle">The all-in-one smart campus platform for university clubs, events, collab feeds, and digital badges.</p>
    </div>

    <!-- AUTH CARD -->
    <div class="auth-card">
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="login-email" class="form-label">College Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input" 
            placeholder="e.g. student@campus.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="login-password" class="form-label">Account Password <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" data-target="login-password" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" style="width: 100%; margin-top: 10px;">
          Sign In to ClubHub
        </button>

        <!-- DEMO CREDENTIALS SHORTCUT -->
        <div class="demo-credentials-box" style="margin-top: 14px; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.8125rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span>⚡ <strong>Student (Aparna):</strong> <code>aparnamaity2609@campus.edu</code></span>
            <button type="button" id="aparna-fill-btn" class="btn btn-outline btn-sm" style="padding: 3px 8px; font-size: 0.72rem;">Auto-fill</button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span>⚡ <strong>Student (Aditya):</strong> <code>aditya.cs23@campus.edu</code></span>
            <button type="button" id="demo-fill-btn" class="btn btn-outline btn-sm" style="padding: 3px 8px; font-size: 0.72rem;">Auto-fill</button>
          </div>
        </div>
      </form>
    </div>

    <!-- FOOTER LINK -->
    <div class="auth-footer">
      New to campus? <a href="register.html" class="auth-link">Create Student Account</a> &bull; <a href="index.html" class="auth-link">Return to Home</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/states.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
