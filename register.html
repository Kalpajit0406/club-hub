<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | CampusConnect</title>
  <meta name="description" content="Register for a CampusConnect account to apply for college clubs and track recruitment stages.">

  <!-- Dark / Light Theme Immediate Init (Anti-Flicker) -->
  <script>
    (function() {
      var saved = localStorage.getItem("campus_connect_theme_v1") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container auth-container-wide">
    
    <!-- BRAND & HEADER -->
    <div class="auth-header">
      <a href="index.html" class="auth-brand" aria-label="Return to CampusConnect Home">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>Campus<span>Connect</span></div>
      </a>
      <h1 class="auth-title">Create your student account</h1>
      <p class="auth-subtitle">Join over 1,800 students exploring university clubs, applying for leadership, and attending workshops.</p>
    </div>

    <!-- AUTH CARD -->
    <div class="auth-card">
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="reg-name" 
            class="form-input" 
            placeholder="e.g. Priya Sharma" 
            required 
            autocomplete="name"
          >
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="reg-roll" class="form-label">Student Roll Number <span class="required">*</span></label>
            <input 
              type="text" 
              id="reg-roll" 
              class="form-input" 
              placeholder="e.g. 2024CSB1055" 
              required
            >
          </div>

          <div class="form-group">
            <label for="reg-year" class="form-label">Year of Study <span class="required">*</span></label>
            <select id="reg-year" class="form-select" required>
              <option value="1st Year">1st Year (Freshman)</option>
              <option value="2nd Year" selected>2nd Year (Sophomore)</option>
              <option value="3rd Year">3rd Year (Junior)</option>
              <option value="4th Year">4th Year (Senior)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="reg-branch" class="form-label">Branch / Department <span class="required">*</span></label>
            <input 
              type="text" 
              id="reg-branch" 
              class="form-input" 
              placeholder="e.g. Computer Science & Engg" 
              required
            >
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">College Email Address <span class="required">*</span></label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-input" 
              placeholder="priya.cs24@campus.edu" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="reg-password" class="form-label">Password <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-password" 
                class="form-input" 
                placeholder="At least 6 characters" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password-btn" data-target="reg-password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-confirm-password" 
                class="form-input" 
                placeholder="Repeat password" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password-btn" data-target="reg-confirm-password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="reg-terms" checked required>
            <span>I agree to the <a href="#" class="auth-link">Campus Student Code of Conduct</a> and Extracurricular Activity Guidelines.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn">
          Create Account & Access Dashboard
        </button>
      </form>
    </div>

    <!-- FOOTER LINK -->
    <div class="auth-footer-prompt">
      Already have an account? 
      <a href="login.html" class="auth-link">Sign in here</a>
    </div>

    <div style="text-align: center; margin-top: 1.25rem;">
      <a href="index.html" style="font-size: 0.8125rem; color: var(--text-secondary);">&larr; Back to CampusConnect Home</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
