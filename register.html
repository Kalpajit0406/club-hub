<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | ClubHub — Smart Campus OS</title>
  <meta name="description" content="Register your verified collegiate profile on ClubHub to apply to societies, register for hackathons, and discover campus events.">

  <!-- Anti-Flicker Theme & Palette Init -->
  <script>
    (function() {
      var savedTheme = localStorage.getItem("clubhub_theme_mode_v2") || "light";
      var savedPalette = localStorage.getItem("clubhub_active_palette") || "indigo-steel";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.documentElement.setAttribute("data-palette", savedPalette);
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container register-container">
    
    <!-- BRAND & HEADER -->
    <div class="auth-header">
      <a href="index.html" class="nav-brand auth-brand" aria-label="Return to ClubHub Home">
        <span class="brand-name">Club<span>Hub</span></span>
      </a>
      <h1 class="auth-title">Create Your Campus Account</h1>
      <p class="auth-subtitle">Join fellow students discovering clubs, attending tech fests, and collaborating on projects.</p>
    </div>

    <!-- AUTH CARD -->
    <div class="auth-card">
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-name" class="form-label">Full Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="reg-name" 
              class="form-input" 
              placeholder="e.g. Priya Sharma" 
              required 
              autocomplete="name"
            >
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-email" class="form-label">College Email Address <span class="required">*</span></label>
            <input 
              type="email" 
              id="reg-email" 
              class="form-input" 
              placeholder="e.g. priya@campus.edu" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-branch" class="form-label">Engineering Department <span class="required">*</span></label>
            <select id="reg-branch" class="form-select" required>
              <option value="" disabled selected>Select Department</option>
              <option value="Computer Science & Engineering">Computer Science & Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Communication">Electronics & Communication</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-year" class="form-label">Year of Study <span class="required">*</span></label>
            <select id="reg-year" class="form-select" required>
              <option value="1">1st Year (Freshman)</option>
              <option value="2" selected>2nd Year (Sophomore)</option>
              <option value="3">3rd Year (Junior)</option>
              <option value="4">4th Year (Senior)</option>
            </select>
          </div>

        </div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-password" class="form-label">Password <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-password" 
                class="form-input" 
                placeholder="At least 6 characters" 
                required 
                autocomplete="new-password"
                minlength="6"
              >
              <button type="button" class="toggle-password-btn" data-target="reg-password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label for="reg-confirm-password" class="form-label">Confirm Password <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="reg-confirm-password" 
                class="form-input" 
                placeholder="Repeat password" 
                required 
                autocomplete="new-password"
                minlength="6"
              >
              <button type="button" class="toggle-password-btn" data-target="reg-confirm-password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-cta auth-submit-btn" style="width: 100%; margin-top: 1.5rem;">
          Create My Campus Account
        </button>
      </form>
    </div>

    <!-- FOOTER LINK -->
    <div class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link">Sign In to ClubHub</a> &bull; <a href="index.html" class="auth-link">Back to Home</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/states.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
